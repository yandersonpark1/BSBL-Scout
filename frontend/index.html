<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kineo" />
    <meta name="theme-color" content="#0c0e09" />
    <!-- Theme bootstrap: runs before first paint so the saved theme never flashes.
         Dark is the default; the `light` class on <html> flips the tokens. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("kineo-theme") === "light") {
            document.documentElement.classList.add("light");
          }
        } catch (e) {
          /* storage unavailable (private mode) — stay dark */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Kineo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
